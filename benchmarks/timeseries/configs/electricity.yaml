# Time-series benchmark config — UCI Electricity Load (ECL) forecasting
# Section layout mirrors configs/default.yaml (TSR's own config) exactly:
# batch_size lives in `training:`, num_workers/root live in `data:`. This is
# deliberate — when TSR's sequence variant is added as a model here, it reads
# the same training/data sections, no config-schema translation needed.
#
# Protocol: standard multivariate long-horizon forecasting (Informer/
# Autoformer/PatchTST convention) — predict the next pred_len steps of ALL
# selected client channels from a seq_len window, report MSE/MAE over the
# full target. pred_lens sweeps the standard ETT-style horizon set.
#
# num_clients=321 matches the standard "ECL" benchmark scale (see
# data/electricity.py's docstring for how the 321 earliest-installed clients
# are selected — this is a real, defensible scale, not padding: 321
# multivariate channels genuinely needs more capacity than a small subset).
#
# Each model has 2 size presets (l/xl) so results form a Pareto curve
# (accuracy vs params) instead of one arbitrary size per model.

task: forecasting

data:
  name: electricity
  root: ./data
  num_workers: 0
  seq_len: 96
  pred_lens: [96, 192, 336, 720]
  num_clients: 321

training:
  batch_size: 128
  max_epochs: 100
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_steps: 200
  min_lr: 0.00001
  grad_clip: 5.0

models:
  lstm:
    presets:
      l:  {hidden_size: 64, num_layers: 2, dropout: 0.1}
      xl: {hidden_size: 128, num_layers: 2, dropout: 0.1}
  gru:
    presets:
      l:  {hidden_size: 64, num_layers: 2, dropout: 0.1}
      xl: {hidden_size: 128, num_layers: 2, dropout: 0.1}
  tcn:
    presets:
      l:  {hidden_channels: 64, num_levels: 4, kernel_size: 3, dropout: 0.1}
      xl: {hidden_channels: 128, num_levels: 4, kernel_size: 3, dropout: 0.1}
  patchtst:
    presets:
      l:  {patch_len: 16, stride: 8, d_model: 64, n_heads: 4, num_layers: 3, dropout: 0.1}
      xl: {patch_len: 16, stride: 8, d_model: 128, n_heads: 8, num_layers: 3, dropout: 0.1}
  mamba:
    presets:
      l:  {d_model: 64, d_state: 16, num_layers: 3, expand: 2, dropout: 0.1}
      xl: {d_model: 128, d_state: 16, num_layers: 3, expand: 2, dropout: 0.1}
  # ── Reserved for TSR (not run here yet — see benchmarks/timeseries/README.md) ──

# TSR configuration — Topological Self-Regulating TCN
tsr:
  seed_channels: 64
  num_levels: 4
  kernel_size: 3
  gate_init: 3.0
  act_init: relu
  norm_group_size: 8
  update_interval: 200
  monitor_window: 100
  death_threshold: 0.01
  min_neurons_per_layer: 4
  gate_sparsity_coeff: 0.0001
  growth_enabled: true
  growth_rate: 0.1
  max_neurons_per_layer: 256
  bottleneck_threshold: 0.1
  phantom_k: 8
  phantom_threshold: 0.005
  max_growth_per_update: 2
  growth_cooldown_steps: 1000
  newborn_gate_init: 0.0
  newborn_protect_steps: 400
  layer_insertion_enabled: true
  layer_insertion_threshold: 2.0
  max_blocks: 6
  cooldown_steps: 50
  anneal_structural_rate: false
  anneal_start_step: 5000
  anneal_factor: 0.95
  channel_independent: true  # PatchTST-style shared per-channel encoder; head params independent of channel count
  flops_price: 0.0  # compute-price loss term (tsr/flops.py); 0 = off, sweep small values

experiment:
  seeds: [42]
  device: auto
