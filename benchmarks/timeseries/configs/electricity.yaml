# Time-series benchmark config — UCI Electricity Load (ECL) forecasting
# Section layout mirrors configs/default.yaml (TSR's own config) exactly:
# batch_size lives in `training:`, num_workers/root live in `data:`. This is
# deliberate — when TSR's sequence variant is added as a model here, it reads
# the same training/data sections, no config-schema translation needed.

task: forecasting

data:
  name: electricity
  root: ./data
  num_workers: 0
  seq_len: 96
  pred_len: 1
  num_clients: 16

training:
  batch_size: 128
  max_epochs: 30
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_steps: 200
  min_lr: 0.00001
  grad_clip: 5.0

models:
  lstm:
    hidden_size: 64
    num_layers: 2
    dropout: 0.1
  gru:
    hidden_size: 64
    num_layers: 2
    dropout: 0.1
  tcn:
    hidden_channels: 64
    num_levels: 4
    kernel_size: 3
    dropout: 0.1
  patchtst:
    patch_len: 16
    stride: 8
    d_model: 64
    n_heads: 4
    num_layers: 3
    dropout: 0.1
  mamba:
    d_model: 64
    d_state: 16
    num_layers: 3
    expand: 2
    dropout: 0.1
  # ── Reserved for TSR (not run here yet — see benchmarks/timeseries/README.md) ──
  # TSR is intentionally excluded from this baseline suite for now. When its
  # sequence variant lands, add a `tsr:` entry here shaped like `regulation:`
  # in configs/default.yaml (phantom_k, phantom_threshold, newborn_gate_init,
  # newborn_protect_steps, gate_sparsity_coeff, growth_rate, max_neurons_per_layer,
  # update_interval, cooldown_steps) plus a `seed_hidden_size` — TSR starts
  # small and grows, rather than training at a fixed width like the baselines
  # above.

experiment:
  seeds: [42, 123, 456]
  device: auto
