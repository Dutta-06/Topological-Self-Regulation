# Time-series benchmark config — UCR/UEA archive classification (subset)

task: classification

data:
  name: ucr_uea
  root: ./data/ucr_uea
  batch_size: 32
  num_workers: 0
  val_fraction: 0.2
  # Representative subset (univariate + multivariate, small + medium size).
  # Extend this list to widen archive coverage.
  datasets: [ECG200, FordA, BasicMotions]

training:
  max_epochs: 50
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_steps: 50
  min_lr: 0.00001
  grad_clip: 5.0

models:
  lstm:
    hidden_size: 64
    num_layers: 2
    dropout: 0.1
  gru:
    hidden_size: 64
    num_layers: 2
    dropout: 0.1
  tcn:
    hidden_channels: 64
    num_levels: 4
    kernel_size: 3
    dropout: 0.1
  patchtst:
    patch_len: 16
    stride: 8
    d_model: 64
    n_heads: 4
    num_layers: 3
    dropout: 0.1
  mamba:
    d_model: 64
    d_state: 16
    num_layers: 3
    expand: 2
    dropout: 0.1

experiment:
  seeds: [42, 123, 456]
  device: auto
