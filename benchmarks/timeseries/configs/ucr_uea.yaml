# Time-series benchmark config — UCR/UEA archive classification (subset)
# Section layout mirrors configs/default.yaml (TSR's own config) exactly:
# batch_size lives in `training:`, num_workers/root live in `data:`. This is
# deliberate — when TSR's sequence variant is added as a model here, it reads
# the same training/data sections, no config-schema translation needed.
#
# Each model has 4 size presets (s/m/l/xl) so results form a Pareto curve
# (accuracy vs params) instead of one arbitrary size per model. PatchTST's
# classification head pools over patches (see models/patchtst.py) so its
# param count stays comparable to the other baselines across datasets of
# different sequence length (FordA seq_len=500 vs ECG200 seq_len=96).

task: classification

data:
  name: ucr_uea
  root: ./data/ucr_uea
  num_workers: 0
  val_fraction: 0.2
  # Representative subset (univariate + multivariate, small + medium size).
  # Extend this list to widen archive coverage.
  datasets: [ECG200, FordA, BasicMotions]

training:
  batch_size: 32
  max_epochs: 50
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_steps: 50
  min_lr: 0.00001
  grad_clip: 5.0

models:
  lstm:
    presets:
      s:  {hidden_size: 16, num_layers: 1, dropout: 0.1}
      m:  {hidden_size: 32, num_layers: 1, dropout: 0.1}
      l:  {hidden_size: 64, num_layers: 2, dropout: 0.1}
      xl: {hidden_size: 128, num_layers: 2, dropout: 0.1}
  gru:
    presets:
      s:  {hidden_size: 16, num_layers: 1, dropout: 0.1}
      m:  {hidden_size: 32, num_layers: 1, dropout: 0.1}
      l:  {hidden_size: 64, num_layers: 2, dropout: 0.1}
      xl: {hidden_size: 128, num_layers: 2, dropout: 0.1}
  tcn:
    presets:
      s:  {hidden_channels: 16, num_levels: 3, kernel_size: 3, dropout: 0.1}
      m:  {hidden_channels: 32, num_levels: 3, kernel_size: 3, dropout: 0.1}
      l:  {hidden_channels: 64, num_levels: 4, kernel_size: 3, dropout: 0.1}
      xl: {hidden_channels: 128, num_levels: 4, kernel_size: 3, dropout: 0.1}
  patchtst:
    presets:
      s:  {patch_len: 16, stride: 8, d_model: 16, n_heads: 2, num_layers: 2, dropout: 0.1}
      m:  {patch_len: 16, stride: 8, d_model: 32, n_heads: 4, num_layers: 2, dropout: 0.1}
      l:  {patch_len: 16, stride: 8, d_model: 64, n_heads: 4, num_layers: 3, dropout: 0.1}
      xl: {patch_len: 16, stride: 8, d_model: 128, n_heads: 8, num_layers: 3, dropout: 0.1}
  mamba:
    presets:
      s:  {d_model: 16, d_state: 8, num_layers: 2, expand: 2, dropout: 0.1}
      m:  {d_model: 32, d_state: 16, num_layers: 2, expand: 2, dropout: 0.1}
      l:  {d_model: 64, d_state: 16, num_layers: 3, expand: 2, dropout: 0.1}
      xl: {d_model: 128, d_state: 16, num_layers: 3, expand: 2, dropout: 0.1}
  # ── Reserved for TSR (not run here yet — see benchmarks/timeseries/README.md) ──
  # TSR is intentionally excluded from this baseline suite for now. When its
  # sequence variant lands, add a `tsr:` entry here shaped like `regulation:`
  # in configs/default.yaml (phantom_k, phantom_threshold, newborn_gate_init,
  # newborn_protect_steps, gate_sparsity_coeff, growth_rate, max_neurons_per_layer,
  # update_interval, cooldown_steps) plus a `seed_hidden_size` — TSR starts
  # small and grows, rather than training at a fixed width like the baselines
  # above.

experiment:
  seeds: [42, 123, 456]
  device: auto
