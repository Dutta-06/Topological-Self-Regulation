# Time-series benchmark config — Weather forecasting
# Section layout mirrors configs/default.yaml (TSR's own config) exactly:
# batch_size lives in `training:`, num_workers/root live in `data:`. This is
# deliberate — when TSR's sequence variant is added as a model here, it reads
# the same training/data sections, no config-schema translation needed.
#
# MPI Jena weather station, 2020, 21 channels, 10-min resolution — the
# standard "Weather" long-horizon forecasting benchmark (Informer/Autoformer/
# PatchTST). Completes the standard LTSF suite alongside ETTh1/ETTh2/Electricity.
#
# Each model has 2 size presets (l/xl) so results form a Pareto curve
# (accuracy vs params) instead of one arbitrary size per model.

task: forecasting

data:
  name: weather
  root: ./data
  num_workers: 0
  seq_len: 96
  pred_lens: [96, 192, 336, 720]

training:
  batch_size: 128
  max_epochs: 100
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_steps: 200
  min_lr: 0.00001
  grad_clip: 5.0

models:
  lstm:
    presets:
      l:  {hidden_size: 64, num_layers: 2, dropout: 0.1}
      xl: {hidden_size: 128, num_layers: 2, dropout: 0.1}
  gru:
    presets:
      l:  {hidden_size: 64, num_layers: 2, dropout: 0.1}
      xl: {hidden_size: 128, num_layers: 2, dropout: 0.1}
  tcn:
    presets:
      l:  {hidden_channels: 64, num_levels: 4, kernel_size: 3, dropout: 0.1}
      xl: {hidden_channels: 128, num_levels: 4, kernel_size: 3, dropout: 0.1}
  patchtst:
    presets:
      l:  {patch_len: 16, stride: 8, d_model: 64, n_heads: 4, num_layers: 3, dropout: 0.1}
      xl: {patch_len: 16, stride: 8, d_model: 128, n_heads: 8, num_layers: 3, dropout: 0.1}
  mamba:
    presets:
      l:  {d_model: 64, d_state: 16, num_layers: 3, expand: 2, dropout: 0.1}
      xl: {d_model: 128, d_state: 16, num_layers: 3, expand: 2, dropout: 0.1}
  # ── Reserved for TSR (not run here yet — see benchmarks/timeseries/README.md) ──
  # TSR is intentionally excluded from this baseline suite for now. When its
  # sequence variant lands, add a `tsr:` entry here shaped like `regulation:`
  # in configs/default.yaml (phantom_k, phantom_threshold, newborn_gate_init,
  # newborn_protect_steps, gate_sparsity_coeff, growth_rate, max_neurons_per_layer,
  # update_interval, cooldown_steps) plus a `seed_hidden_size` — TSR starts
  # small and grows, rather than training at a fixed width like the baselines
  # above.

experiment:
  seeds: [42, 123, 456]
  device: auto
