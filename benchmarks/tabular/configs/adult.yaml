# Tabular benchmark config — UCI Adult (Census Income) classification
# Section layout mirrors benchmarks/timeseries/configs/*.yaml and TSR's own
# configs/default.yaml.
#
# Small dataset (32,561 train rows) — no preset sweep needed, single fixed
# model size per baseline. This is the one dataset in the suite with
# genuine categorical columns (8 of them), exercising the categorical
# embedding code path in every model.

task: classification

data:
  name: adult
  root: ./data
  num_workers: 0
  val_fraction: 0.15

training:
  batch_size: 256
  max_epochs: 100
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_steps: 100
  min_lr: 0.00001
  grad_clip: 5.0

models:
  mlp:
    presets:
      m: {hidden_size: 64, num_layers: 2, dropout: 0.1}
  resnet_mlp:
    presets:
      m: {d_main: 64, d_hidden: 128, num_blocks: 2, dropout: 0.1}
  ft_transformer:
    presets:
      m: {d_token: 32, n_heads: 4, num_layers: 2, dropout: 0.1}
  tabnet:
    presets:
      m: {n_d: 32, n_a: 32, n_steps: 3, gamma: 1.5, dropout: 0.1}
  saint:
    presets:
      m: {d_token: 8, n_heads: 2, num_layers: 2, dropout: 0.1}
  # ── Reserved for TSR (see benchmarks/tabular/README.md) ──

experiment:
  seeds: [42]
  device: auto
