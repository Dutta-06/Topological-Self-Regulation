# Tabular benchmark config — California Housing regression
# Section layout mirrors benchmarks/timeseries/configs/*.yaml and TSR's own
# configs/default.yaml.
#
# Small dataset (20,640 rows), 8 continuous features, no categoricals — no
# preset sweep needed, single fixed model size per baseline.
#
# Target (median house value, $100,000s) is standardized for training and
# unstandardized before computing metrics — see data/california_housing.py.

task: regression

data:
  name: california_housing
  root: ./data
  num_workers: 0
  val_fraction: 0.1
  test_fraction: 0.2

training:
  batch_size: 256
  max_epochs: 100
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_steps: 100
  min_lr: 0.00001
  grad_clip: 5.0

models:
  mlp:
    presets:
      m: {hidden_size: 64, num_layers: 2, dropout: 0.1}
  resnet_mlp:
    presets:
      m: {d_main: 64, d_hidden: 128, num_blocks: 2, dropout: 0.1}
  ft_transformer:
    presets:
      m: {d_token: 32, n_heads: 4, num_layers: 2, dropout: 0.1}
  tabnet:
    presets:
      m: {n_d: 32, n_a: 32, n_steps: 3, gamma: 1.5, dropout: 0.1}
  saint:
    presets:
      m: {d_token: 8, n_heads: 2, num_layers: 2, dropout: 0.1}
  # ── Reserved for TSR (see benchmarks/tabular/README.md) ──

# TSR configuration — Topological Self-Regulating MLP
#
# California-specific tuning (small, clean, 8-feature regression set — see
# [[tsr-core-claim]]'s matched-param ablation): the static_final control
# proves this architecture reaches mse~0.35 on pure task loss alone, so any
# TSR-only regularization tax shows up directly as a worse number. Two
# changes vs. the other datasets:
#   - seed_hidden shrunk from [64,64] (== the baseline mlp/m preset size) to
#     [16,16]: seeding AT the eventual target size gives growth nothing to
#     do — it's a curriculum, not a decoration, only if there's real
#     headroom to grow into.
#   - dropout 0 (was 0.1): static_final already reaches its number without
#     it; on 14K training rows dropout has real bite, not just insurance.
tsr:
  seed_hidden: [16, 16]
  cat_emb_dim: 8
  gate_init: 3.0
  act_init: relu
  norm_group_size: 8
  update_interval: 200
  monitor_window: 100
  death_threshold: 0.01
  prune_gate_threshold: 0.15  # primary/dominant death signal (sigmoid(gate) below this = dead); death_threshold above is now a weak secondary activation-magnitude OR-catch
  min_neurons_per_layer: 4
  gate_sparsity_coeff: 0.0001
  gate_sparsity_final: 0.0
  gate_sparsity_warmup_frac: 0.1
  growth_enabled: true
  growth_rate: 0.1
  max_neurons_per_layer: 256
  bottleneck_threshold: 0.1
  phantom_k: 8
  phantom_threshold: 0.005
  max_growth_per_update: 2
  growth_cooldown_steps: 1000
  newborn_gate_init: 0.0
  newborn_protect_steps: 400
  layer_insertion_enabled: true
  layer_insertion_threshold: 2.0
  max_blocks: 6
  cooldown_steps: 50
  anneal_structural_rate: false
  anneal_start_step: 5000
  anneal_factor: 0.95
  dropout: 0.0
  flops_price: 0.0  # compute-price loss term (tsr/flops.py); 0 = off, sweep small values

experiment:
  seeds: [42]
  device: auto
